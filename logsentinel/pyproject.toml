[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Defensive log analyser that reports suspicious behaviour in server logs"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools]
packages = ["logsentinel"]
